name: Render P0 Deploy Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/render-p0-deploy-recovery.yml"
      - "Dockerfile"
      - "render.yaml"
      - "client/web/**"
      - "server/**"
      - "runtime/packs/PACK_99_RECOVERED/production-release.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-p0-deploy-recovery.yml"
      - "Dockerfile"
      - "render.yaml"
      - "client/web/**"
      - "server/**"
      - "runtime/packs/PACK_99_RECOVERED/production-release.json"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_P0 to deploy the current main commit"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: render-p0-deploy-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate recovery workflow contract
        run: |
          set -euo pipefail
          workflow=.github/workflows/render-p0-deploy-recovery.yml
          grep -q 'workflow_dispatch:' "$workflow"
          grep -q 'push:' "$workflow"
          grep -q 'Dockerfile' "$workflow"
          grep -q 'render.yaml' "$workflow"
          grep -q 'client/web/\*\*' "$workflow"
          grep -q 'server/\*\*' "$workflow"
          grep -q 'DEPLOY_P0' "$workflow"
          grep -q 'RENDER_API_KEY' "$workflow"
          grep -q 'RENDER_SERVICE_ID' "$workflow"
          grep -q 'RENDER_DEPLOY_HOOK_URL' "$workflow"
          grep -q 'missing-render-credentials' "$workflow"
          grep -q 'recovery-blocker.json' "$workflow"
          grep -q 'production-pack99-gate.mjs' "$workflow"
          grep -q 'issue_number: 333' "$workflow"
          echo 'RENDER_P0_RECOVERY_CONTRACT=PASS'

  deploy-and-verify:
    if: github.ref_name == 'main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Select Render deployment route
        id: route
        shell: bash
        run: |
          set -euo pipefail

          route="none"
          reason=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm }}" != "DEPLOY_P0" ]; then
            reason="confirmation"
          elif [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            route="api"
          elif [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            route="hook"
          else
            reason="missing-render-credentials"
          fi

          echo "route=${route}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

          if [ "$route" = "none" ]; then
            echo "RENDER_RECOVERY=BLOCKED reason=${reason}"
          else
            echo "RENDER_RECOVERY_ROUTE=${route}"
          fi

      - name: Trigger exact main commit through Render API
        if: steps.route.outputs.route == 'api'
        id: api-deploy
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${GITHUB_SHA}\"}")
          printf '%s\n' "$response" > render-deploy-response.json
          deploy_id=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("id", "unknown"))')
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "RENDER_RECOVERY_TRIGGERED route=api commit=${GITHUB_SHA} deploy=${deploy_id}"

      - name: Trigger linked Render service through Deploy Hook
        if: steps.route.outputs.route == 'hook'
        id: hook-deploy
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error -X POST "${RENDER_DEPLOY_HOOK_URL}")
          printf '%s\n' "$response" > render-deploy-response.json
          echo "RENDER_RECOVERY_TRIGGERED route=hook commit=${GITHUB_SHA}"

      - name: Checkout
        if: steps.route.outputs.route != 'none'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.route.outputs.route != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/web/package.json

      - name: Install Web dependencies
        if: steps.route.outputs.route != 'none'
        working-directory: client/web
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        if: steps.route.outputs.route != 'none'
        working-directory: client/web
        run: npx playwright install --with-deps chromium

      - name: Verify recovered Render production
        if: steps.route.outputs.route != 'none'
        id: production-gate
        working-directory: client/web
        env:
          HEXA_PRODUCTION_URL: https://hexa-octarina-conquer.onrender.com
          HEXA_PRODUCTION_ATTEMPTS: "32"
          HEXA_PRODUCTION_DELAY_MS: "15000"
        run: |
          set -o pipefail
          mkdir -p artifacts/hoc2-render-recovery
          set +e
          node scripts/production-pack99-gate.mjs 2>&1 | tee artifacts/hoc2-render-recovery/production-gate.log
          status=${PIPESTATUS[0]}
          set -e

          detail=$(grep -E 'PRODUCTION_GATE=(PASS|FAIL)|PRODUCTION_GATE_ATTEMPT_FAILED=' artifacts/hoc2-render-recovery/production-gate.log | tail -n 1 || true)
          {
            echo 'detail<<EOF'
            echo "${detail:-unknown}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          exit "$status"

      - name: Preserve recovery evidence
        if: always()
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          ROUTE_REASON: ${{ steps.route.outputs.reason }}
          GATE_OUTCOME: ${{ steps.production-gate.outcome }}
          GATE_DETAIL: ${{ steps.production-gate.outputs.detail }}
        run: |
          set -euo pipefail
          evidence_dir="client/web/artifacts/hoc2-render-recovery"
          mkdir -p "$evidence_dir"

          route="${ROUTE:-unknown}"
          reason="${ROUTE_REASON:-}"
          gate_outcome="${GATE_OUTCOME:-skipped}"
          gate_detail="${GATE_DETAIL:-}"

          if [ "$route" = "none" ]; then
            cat > "$evidence_dir/recovery-blocker.json" <<EOF
          {
            "status": "BLOCKED",
            "event": "${GITHUB_EVENT_NAME}",
            "commit": "${GITHUB_SHA}",
            "route": "${route}",
            "reason": "${reason:-unknown}",
            "productionVerification": "${gate_outcome}",
            "message": "No Render deployment was attempted because no supported credential route was available."
          }
          EOF
            printf 'RENDER_RECOVERY=BLOCKED reason=%s route=%s commit=%s\n' \
              "${reason:-unknown}" "$route" "$GITHUB_SHA" \
              > "$evidence_dir/recovery-blocker.txt"
          fi

          if [ -f render-deploy-response.json ]; then
            cp render-deploy-response.json "$evidence_dir/render-deploy-response.json"
          fi

          if [ -d client/web/artifacts/hoc2-production-gate ]; then
            cp -a client/web/artifacts/hoc2-production-gate/. "$evidence_dir/"
          fi

          if [ -n "$gate_detail" ]; then
            printf '%s\n' "$gate_detail" > "$evidence_dir/gate-detail.txt"
          fi

      - name: Upload Render recovery evidence
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoc2-render-recovery
          path: client/web/artifacts/hoc2-render-recovery
          if-no-files-found: error
          retention-days: 30

      - name: Report recovery result to P0 issue
        if: always()
        uses: actions/github-script@v7
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          ROUTE_REASON: ${{ steps.route.outputs.reason }}
          GATE_OUTCOME: ${{ steps.production-gate.outcome }}
          GATE_DETAIL: ${{ steps.production-gate.outputs.detail }}
          EVIDENCE_OUTCOME: ${{ steps.evidence-upload.outcome }}
          API_DEPLOY_ID: ${{ steps.api-deploy.outputs.deploy_id }}
        with:
          script: |
            const route = process.env.ROUTE || 'unknown';
            const routeReason = process.env.ROUTE_REASON || '';
            const gateOutcome = process.env.GATE_OUTCOME || 'skipped';
            const rawDetail = process.env.GATE_DETAIL || '';
            const gateDetail = (rawDetail || (route === 'none' ? `RENDER_RECOVERY=BLOCKED reason=${routeReason || 'unknown'}` : 'unknown'))
              .replace(/`/g, "'")
              .slice(0, 800);
            const evidenceOutcome = process.env.EVIDENCE_OUTCOME || 'unknown';
            const deployId = process.env.API_DEPLOY_ID || 'n/a';
            const pass = gateOutcome === 'success';
            const verdict = pass ? 'PASS' : 'BLOCKED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## P0 Render Deploy Recovery — ${verdict}`,
              '',
              `- event: \`${context.eventName}\`;`,
              `- commit: \`${context.sha}\`;`,
              `- route: \`${route}\`;`,
              `- route reason: \`${routeReason || 'n/a'}\`;`,
              `- Render deploy id: \`${deployId}\`;`,
              `- production verification: \`${gateOutcome}\`;`,
              `- evidence upload: \`${evidenceOutcome}\`;`,
              `- gate detail: \`${gateDetail}\`;`,
              '- artifact: `hoc2-render-recovery`;',
              `- run: ${runUrl}.`,
              '',
              pass
                ? 'O deploy remoto foi acionado e o endpoint canônico passou no contrato HOC2 + PACK 99. A revisão humana das capturas continua obrigatória antes de encerrar o #333 e liberar VS02.'
                : route === 'none'
                  ? 'Nenhum deploy Render foi tentado porque o GitHub Actions não possui uma rota de credencial configurada. O artifact preserva esse blocker explicitamente; o #333 e o freeze de VS02 permanecem ativos.'
                  : 'A recuperação remota não produziu uma candidata aprovada. O #333 e o freeze de VS02 permanecem ativos; use o artifact para separar deploy de regressão visual.',
              '',
              '**Tehkné Solutions**',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 333,
              body,
            });

      - name: Fail closed when recovery is blocked
        if: always() && (steps.route.outputs.route == 'none' || steps.production-gate.outcome != 'success')
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          ROUTE_REASON: ${{ steps.route.outputs.reason }}
          GATE_OUTCOME: ${{ steps.production-gate.outcome }}
        run: |
          echo "RENDER_RECOVERY=BLOCKED route=${ROUTE:-unknown} reason=${ROUTE_REASON:-unknown} gate=${GATE_OUTCOME:-skipped}"
          exit 1
