name: Progressive Pack Contracts

on:
  pull_request:
    paths:
      - "scripts/audit_progressive_pack.py"
      - "scripts/install_progressive_pack.py"
      - "scripts/publish_pack01_release.ps1"
      - "PUBLICAR-PACK01-RELEASE.cmd"
      - "tests/test_audit_progressive_pack.py"
      - "tests/test_install_progressive_pack.py"
      - "runtime/packs/**"
      - "client/web/src/progressive-terrain*"
      - "client/web/src/ProgressiveTerrainLayer.tsx"
      - "client/web/src/GoDotsBoard.tsx"
      - "client/web/src/main.tsx"
      - "client/web/vite.config.ts"
      - "client/godot/scripts/progressive_terrain_runtime.gd"
      - "client/godot/scripts/runtime_board_decorator.gd"
      - "client/godot/project.godot"
      - "docs/SPRINT_ASSETS_PROGRESSIVE_*.md"
      - "docs/reports/PACK01_AUDIT_REPORT.md"
      - ".github/workflows/progressive-pack-contracts.yml"
      - ".github/workflows/progressive-pack01-promote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-contracts:
    name: PACK 00–01 progressive contracts (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile progressive tools
        run: |
          python -m py_compile scripts/audit_progressive_pack.py
          python -m py_compile scripts/install_progressive_pack.py
      - name: Run progressive pack tests
        run: |
          python -m unittest \
            tests/test_audit_progressive_pack.py \
            tests/test_install_progressive_pack.py \
            -v
      - name: Validate progressive locks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pack00 = json.loads(Path("runtime/packs/PACK_00_FOUNDATION/pack-lock.json").read_text(encoding="utf-8"))
          assert pack00["packId"] == "HOC_PACK_00_FOUNDATION"
          assert pack00["version"] == "1.1.0"
          assert pack00["candidate"]["runtimeAssets"] == 0
          assert pack00["candidate"]["referenceAssets"] == 1
          assert pack00["candidate"]["unresolvedReferences"] == 0
          assert pack00["signature"] == "Tehkné Solutions"

          pack01 = json.loads(Path("runtime/packs/PACK_01_TERRAIN_CORE/pack-lock.json").read_text(encoding="utf-8"))
          assert pack01["packId"] == "HOC_PACK_01_TERRAIN_CORE_FINAL"
          assert pack01["version"] == "1.1.0"
          assert pack01["requires"]["HOC_PACK_00_FOUNDATION"] == "1.1.0"
          assert pack01["candidate"]["runtimeAssets"] == 103
          assert pack01["candidate"]["uniqueIds"] == 103
          assert pack01["candidate"]["unresolvedReferences"] == 0
          assert pack01["candidate"]["edgeBleedPx"] == 8
          assert pack01["candidate"]["runtimeGridStepPx"] == [252, 124]
          assert pack01["overlayA01"]["changedTiles"] == 10
          assert pack01["overlayA01"]["changedMasks"] == 0
          assert pack01["signature"] == "Tehkné Solutions"
          PY

  windows-publisher:
    name: PACK 01 Windows publisher contract
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse PowerShell publisher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/publish_pack01_release.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Validate launcher encoding and target
        shell: powershell
        run: |
          $launcher = Get-Content -Raw -Encoding UTF8 "PUBLICAR-PACK01-RELEASE.cmd"
          if (-not $launcher.Contains("publish_pack01_release.ps1")) { throw "Lançador não chama o publicador do PACK 01." }
          if (-not $launcher.Contains("chcp 65001")) { throw "Lançador não configura UTF-8." }
