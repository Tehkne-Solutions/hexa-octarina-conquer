name: PACK 99 Publisher Contract

on:
  pull_request:
    paths:
      - "PUBLICAR-PACK99-RELEASE.cmd"
      - "scripts/publish_pack99_release.ps1"
      - "scripts/validate_publish_pack99_release_contract.py"
      - "tests/test_publish_pack99_release_contract.py"
      - ".github/workflows/pack99-publisher-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate publisher contract
        run: |
          python scripts/validate_publish_pack99_release_contract.py
          python -m unittest tests/test_publish_pack99_release_contract.py -v
          python -m py_compile scripts/validate_publish_pack99_release_contract.py
