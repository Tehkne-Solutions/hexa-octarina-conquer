name: PACK 99 Release Promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release contendo o runtime
        required: true
        default: pack99-runtime-v1.0.1
        type: string
      asset_name:
        description: Nome do ZIP integral
        required: true
        default: HOC_PACK_99_FINAL_RUNTIME_RECOVERED_1.0.1.zip
        type: string
      sha256:
        description: SHA-256 esperado do ZIP
        required: true
        default: f72cce299fd28c8bb8520320871d90057884bb0ec19dd449f1c3d07e56a71bbe
        type: string
      publish_artifacts:
        description: Publicar runtimes instalados como artefatos temporários
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pack99-release-promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Download, audit, install and validate full runtime
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.sha256 }}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "SHA-256 inválido." >&2
            exit 2
          fi
          if [[ "${{ inputs.asset_name }}" == *"/"* || "${{ inputs.asset_name }}" == *".."* ]]; then
            echo "Nome de asset inseguro." >&2
            exit 2
          fi

      - name: Test runtime contracts
        run: |
          python -m unittest \
            tests/test_install_pack99.py \
            tests/test_sync_pack99.py \
            tests/test_validate_pack99_promotion.py \
            tests/test_audit_pack99_archive.py -v
          python -m py_compile \
            scripts/install_pack99.py \
            scripts/sync_pack99.py \
            scripts/validate_pack99_promotion.py \
            scripts/audit_pack99_archive.py

      - name: Download runtime from GitHub Release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p .cache/pack99
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
          echo "Downloading ${URL}"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output ".cache/pack99/${ASSET_NAME}.part" \
            "${URL}"
          mv ".cache/pack99/${ASSET_NAME}.part" ".cache/pack99/${ASSET_NAME}"

      - name: Verify release asset checksum
        shell: bash
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(sha256sum ".cache/pack99/${ASSET_NAME}" | awk '{print $1}')"
          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256,,}" ]]; then
            echo "Checksum divergente: esperado ${EXPECTED_SHA256,,}; recebido ${ACTUAL_SHA256}." >&2
            exit 2
          fi
          echo "Checksum validado: ${ACTUAL_SHA256}"

      - name: Audit every file and canonical runtime reference
        shell: bash
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          python scripts/audit_pack99_archive.py \
            ".cache/pack99/${ASSET_NAME}" \
            --report .cache/pack99/archive-integrity-report.json \
            --summary-only

      - name: Install full runtime in Web and Godot
        shell: bash
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          python scripts/sync_pack99.py \
            --source ".cache/pack99/${ASSET_NAME}" \
            --expected-sha256 "${EXPECTED_SHA256}" \
            --target all \
            --profile full \
            --clean \
            --report .cache/pack99/sync-full-release-report.json

      - name: Validate 1037 identical IDs and no bootstrap
        run: |
          python scripts/validate_pack99_promotion.py \
            --report .cache/pack99/promotion-release-report.json

      - name: Create release verification summary
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          cat > .cache/pack99/release-verification.md <<EOF
          # PACK 99 Release Verification

          - tag: ${TAG}
          - asset: ${ASSET_NAME}
          - sha256: ${EXPECTED_SHA256}
          - arquivo completo: auditado individualmente por SHA-256
          - referências canônicas: zero pendências
          - Web: 1.037 IDs, zero pendências
          - Godot: 1.037 IDs, zero pendências
          - bootstrap: ausente no runtime promovido
          - aliases provisórios: ausentes
          - fallback procedural: desabilitado no runtime promovido
          - assinatura: Tehkné Solutions
          EOF

      - name: Upload promotion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoc-pack99-release-promotion-reports
          path: |
            .cache/pack99/*report.json
            .cache/pack99/release-verification.md
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Web full runtime
        if: ${{ success() && inputs.publish_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: hoc-pack99-web-full-release
          path: client/web/public/assets/runtime
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Godot full runtime
        if: ${{ success() && inputs.publish_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: hoc-pack99-godot-full-release
          path: client/godot/assets/runtime
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
