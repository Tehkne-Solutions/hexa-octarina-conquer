name: Web PACK 99 Validation

on:
  pull_request:
    paths:
      - "client/web/**"
      - ".github/workflows/web-pack99-validation.yml"
  push:
    branches:
      - agent/pack99-one-shot-mapper
    paths:
      - "client/web/**"
      - ".github/workflows/web-pack99-validation.yml"

permissions:
  contents: read

concurrency:
  group: web-pack99-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Test and build web client
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: client/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test

      - name: Build production client
        run: npm run build
