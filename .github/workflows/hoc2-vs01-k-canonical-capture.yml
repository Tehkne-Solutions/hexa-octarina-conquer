name: HOC2 VS01-K Canonical Capture

on:
  pull_request:
    paths:
      - "client/web/**"
      - ".github/workflows/hoc2-vs01-k-canonical-capture.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/web/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize PACK 99 full runtime
        run: |
          set -euo pipefail
          runtime_name="hoc-pack99-web-full.zip"
          checksum_name="hoc-pack99-web-full.zip.sha256"
          release_base="https://github.com/Tehkne-Solutions/hexa-octarina-conquer/releases/download/pack99-runtime-v1.0.2"
          curl --fail --location --silent --show-error --retry 3 "${release_base}/${runtime_name}" -o "/tmp/${runtime_name}"
          curl --fail --location --silent --show-error --retry 3 "${release_base}/${checksum_name}" -o "/tmp/${checksum_name}"
          (cd /tmp && sha256sum --check "${checksum_name}")
          rm -rf public/assets/runtime
          mkdir -p public/assets/runtime
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('/tmp/hoc-pack99-web-full.zip')
          destination = Path('public/assets/runtime').resolve()
          with ZipFile(archive) as zf:
              entries = []
              roots = []
              for info in zf.infolist():
                  normalized = info.filename.replace('\\', '/')
                  parts = [p for p in PurePosixPath(normalized).parts if p not in ('', '.')]
                  if not parts or '..' in parts:
                      raise SystemExit(f'PACK99_UNSAFE_ZIP_ENTRY:{info.filename}')
                  entries.append((info, normalized, parts))
                  if parts[-1] == 'runtime-install.json':
                      roots.append(parts[:-1])
              if len(roots) != 1:
                  raise SystemExit(f'PACK99_RUNTIME_ROOT_AMBIGUOUS:{roots}')
              root = roots[0]
              for info, normalized, parts in entries:
                  if root and parts[:len(root)] == root:
                      parts = parts[len(root):]
                  if not parts:
                      continue
                  target = destination.joinpath(*parts).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f'PACK99_ZIP_ESCAPE:{info.filename}')
                  if info.is_dir() or normalized.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, target.open('wb') as sink:
                          sink.write(source.read())
          PY
          node ../../scripts/verify-web-pack99.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build HOC2 playtest candidate
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --port 4173 > /tmp/hoc2-vs01-k-preview.log 2>&1 &
          echo $! > /tmp/hoc2-vs01-k-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/hoc2.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hoc2-vs01-k-preview.log
          exit 1

      - name: Capture PACK 99 strategic asset atlas
        run: node scripts/capture-hoc2-asset-atlas.mjs

      - name: Capture 11 canonical states
        run: node scripts/capture-hoc2-vs01-k.mjs

      - name: Verify canonical matrix
        run: |
          test "$(find artifacts/hoc2-vs01-k -maxdepth 1 -name '*.png' | wc -l)" -eq 11
          test -f artifacts/hoc2-asset-atlas/pack99-strategic-assets.png
          echo "HOC2_VS01_K_CAPTURE_GATE=PASS count=11 atlas=1"

      - name: Upload HOC2 canonical captures
        uses: actions/upload-artifact@v4
        with:
          name: hoc2-vs01-k-canonical-captures
          path: |
            client/web/artifacts/hoc2-vs01-k
            client/web/artifacts/hoc2-asset-atlas
          if-no-files-found: error
          retention-days: 30

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/hoc2-vs01-k-preview.pid ]; then
            kill "$(cat /tmp/hoc2-vs01-k-preview.pid)" || true
          fi
          cat /tmp/hoc2-vs01-k-preview.log || true
