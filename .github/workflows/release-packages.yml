name: Release Packages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-package:
    name: Certified Web/PWA package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install web dependencies
        working-directory: client/web
        run: npm install
      - name: Verify and build certified Web/PWA
        working-directory: client/web
        run: npm run check
      - name: Package Web/PWA
        run: |
          mkdir -p build/release
          cd client/web/dist
          zip -qr ../../../build/release/HOC-v0.1.0-Web-PWA.zip .
      - name: Generate checksum and manifest
        run: |
          cd build/release
          sha256sum HOC-v0.1.0-Web-PWA.zip | tee HOC-v0.1.0-Web-PWA.sha256
          printf '%s\n' \
            'HOC v0.1.0 — certified Web/PWA distribution' \
            'Client: React/Vite PWA' \
            'PACK 99 production certification: 1037/1037' \
            'Native Godot Windows/Android packages are NOT approved for v0.1.0 distribution until client parity is proven.' \
            'Signature: Tehkné Solutions' \
            > HOC-v0.1.0-Web-PWA-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HOC-v0.1.0-Web-PWA-CERTIFIED
          path: |
            build/release/HOC-v0.1.0-Web-PWA.zip
            build/release/HOC-v0.1.0-Web-PWA.sha256
            build/release/HOC-v0.1.0-Web-PWA-MANIFEST.txt
          if-no-files-found: error
