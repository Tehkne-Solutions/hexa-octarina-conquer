name: PACK 99 Visual Runtime Gate

on:
  pull_request:
    paths:
      - "client/web/**"
      - ".github/workflows/pack99-visual-runtime-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack99-visual-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Materialize PACK 99 full runtime
        run: |
          set -euo pipefail
          runtime_name="hoc-pack99-web-full.zip"
          checksum_name="hoc-pack99-web-full.zip.sha256"
          release_base="https://github.com/Tehkne-Solutions/hexa-octarina-conquer/releases/download/pack99-runtime-v1.0.2"
          curl --fail --location --silent --show-error --retry 3 "${release_base}/${runtime_name}" -o "/tmp/${runtime_name}"
          curl --fail --location --silent --show-error --retry 3 "${release_base}/${checksum_name}" -o "/tmp/${checksum_name}"
          (cd /tmp && sha256sum --check "${checksum_name}")
          rm -rf public/assets/runtime
          mkdir -p public/assets/runtime
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path('/tmp/hoc-pack99-web-full.zip')
          destination = Path('public/assets/runtime').resolve()

          with ZipFile(archive) as zf:
              entries = []
              runtime_roots = []
              for info in zf.infolist():
                  normalized = info.filename.replace('\\', '/')
                  parts = [part for part in PurePosixPath(normalized).parts if part not in ('', '.')]
                  if not parts or '..' in parts:
                      raise SystemExit(f'PACK99_UNSAFE_ZIP_ENTRY:{info.filename}')
                  entries.append((info, normalized, parts))
                  if parts[-1] == 'runtime-install.json':
                      runtime_roots.append(parts[:-1])

              if len(runtime_roots) != 1:
                  raise SystemExit(f'PACK99_RUNTIME_ROOT_AMBIGUOUS:{runtime_roots}')
              root_prefix = runtime_roots[0]
              print('PACK99_ARCHIVE_ROOT=' + ('/'.join(root_prefix) if root_prefix else '<root>'))

              for info, normalized, parts in entries:
                  if root_prefix and parts[:len(root_prefix)] == root_prefix:
                      parts = parts[len(root_prefix):]
                  if not parts:
                      continue
                  target = destination.joinpath(*parts).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f'PACK99_ZIP_ESCAPE:{info.filename}')
                  if info.is_dir() or normalized.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, target.open('wb') as sink:
                          sink.write(source.read())
          PY
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'public/assets/runtime';
          const install = JSON.parse(fs.readFileSync(`${root}/runtime-install.json`, 'utf8'));
          const registry = JSON.parse(fs.readFileSync(`${root}/registry/assets-runtime.json`, 'utf8'));
          const aliases = JSON.parse(fs.readFileSync('public/canonical-runtime-aliases.json', 'utf8'));
          const required = [
            'HERO_GUARDIAN_01_IDLE_BASE_SW_01',
            'HERO_RANGER_01_IDLE_BASE_NE_01',
            'UNIT_RECRUIT_01_IDLE_BASE_NW_01',
            'CHAMP_BERSERKER_01_IDLE_BASE_NW_01',
          ];
          const countFiles = (dir) => fs.readdirSync(dir, { withFileTypes: true }).reduce((total, entry) => {
            const current = path.join(dir, entry.name);
            return total + (entry.isDirectory() ? countFiles(current) : 1);
          }, 0);
          const materializedFileCount = countFiles(root);
          if (install.profile !== 'full' || install.assetCount !== 1037 || install.unresolvedReferences !== 0) throw new Error('PACK99_VISUAL_INSTALL_INVALID');
          if (registry.profile !== 'full' || registry.assetCount !== 1037 || !Array.isArray(registry.assets) || registry.assets.length !== 1037 || !Array.isArray(registry.unresolved) || registry.unresolved.length !== 0) throw new Error('PACK99_VISUAL_REGISTRY_INVALID');
          if (materializedFileCount < 1850) throw new Error(`PACK99_VISUAL_MATERIALIZED=${materializedFileCount}`);
          for (const id of required) if (!aliases.aliases?.[id]) throw new Error(`PACK99_VISUAL_ALIAS_MISSING:${id}`);
          const contract = {
            profile: install.profile,
            canonicalAssetCount: registry.assets.length,
            materializedFileCount,
            unresolvedReferences: install.unresolvedReferences,
            aliasesValidated: required.length,
          };
          fs.writeFileSync(`${root}/visual-gate-contract.json`, JSON.stringify(contract, null, 2) + '\n');
          console.log(`PACK99_VISUAL_RUNTIME=full canonical=${contract.canonicalAssetCount} materialized=${contract.materializedFileCount} aliases=${required.length}`);
          NODE

      - name: Test and build with canonical runtime
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hexa-pack99-visual-preview.log 2>&1 &
          echo $! > /tmp/hexa-pack99-visual-preview.pid
          npx --yes wait-on@8.0.3 http://127.0.0.1:4173

      - name: Verify rendered canonical assets and capture evidence
        run: node scripts/visual-pack99-runtime-gate.mjs

      - name: Upload canonical visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: hexa-octarina-pack99-visual-runtime
          path: client/web/visual-qa-pack99
          retention-days: 30
          if-no-files-found: error

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/hexa-pack99-visual-preview.pid ]; then
            kill "$(cat /tmp/hexa-pack99-visual-preview.pid)" || true
          fi
          cat /tmp/hexa-pack99-visual-preview.log || true
