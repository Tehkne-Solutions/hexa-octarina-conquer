name: HOC2 PLAYTEST 01 Portable Web Package

on:
  pull_request:
    paths:
      - "client/web/**"
      - ".github/workflows/hoc2-playtest01-portable-web.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/web/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Materialize PACK 99 full runtime
        run: |
          set -euo pipefail
          runtime_name="hoc-pack99-web-full.zip"
          checksum_name="hoc-pack99-web-full.zip.sha256"
          release_base="https://github.com/Tehkne-Solutions/hexa-octarina-conquer/releases/download/pack99-runtime-v1.0.2"
          curl --fail --location --silent --show-error --retry 3 "${release_base}/${runtime_name}" -o "/tmp/${runtime_name}"
          curl --fail --location --silent --show-error --retry 3 "${release_base}/${checksum_name}" -o "/tmp/${checksum_name}"
          (cd /tmp && sha256sum --check "${checksum_name}")
          rm -rf public/assets/runtime
          mkdir -p public/assets/runtime
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('/tmp/hoc-pack99-web-full.zip')
          destination = Path('public/assets/runtime').resolve()
          with ZipFile(archive) as zf:
              entries = []
              roots = []
              for info in zf.infolist():
                  normalized = info.filename.replace('\\', '/')
                  parts = [p for p in PurePosixPath(normalized).parts if p not in ('', '.')]
                  if not parts or '..' in parts:
                      raise SystemExit(f'PACK99_UNSAFE_ZIP_ENTRY:{info.filename}')
                  entries.append((info, normalized, parts))
                  if parts[-1] == 'runtime-install.json':
                      roots.append(parts[:-1])
              if len(roots) != 1:
                  raise SystemExit(f'PACK99_RUNTIME_ROOT_AMBIGUOUS:{roots}')
              root = roots[0]
              for info, normalized, parts in entries:
                  if root and parts[:len(root)] == root:
                      parts = parts[len(root):]
                  if not parts:
                      continue
                  target = destination.joinpath(*parts).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f'PACK99_ZIP_ESCAPE:{info.filename}')
                  if info.is_dir() or normalized.endswith('/'):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, target.open('wb') as sink:
                          sink.write(source.read())
          PY
          node ../../scripts/verify-web-pack99.mjs

      - name: Build production HOC2 candidate
        run: npm run build

      - name: Assemble portable package
        run: |
          set -euo pipefail
          rm -rf portable
          mkdir -p portable/HOC2-PLAYTEST-01
          cp -a dist/. portable/HOC2-PLAYTEST-01/
          cat > portable/HOC2-PLAYTEST-01/INICIAR-HOC2.cmd <<'CMD'
          @echo off
          cd /d "%~dp0"
          where py >nul 2>nul && (start "" http://127.0.0.1:4173/hoc2.html & py -m http.server 4173 & exit /b)
          where python >nul 2>nul && (start "" http://127.0.0.1:4173/hoc2.html & python -m http.server 4173 & exit /b)
          echo Python 3 nao encontrado. Instale Python ou sirva esta pasta com qualquer servidor HTTP local.
          pause
          CMD
          cat > portable/HOC2-PLAYTEST-01/INICIAR-HOC2.ps1 <<'PS1'
          Set-Location $PSScriptRoot
          Start-Process "http://127.0.0.1:4173/hoc2.html"
          if (Get-Command py -ErrorAction SilentlyContinue) { py -m http.server 4173; exit }
          if (Get-Command python -ErrorAction SilentlyContinue) { python -m http.server 4173; exit }
          Write-Host "Python 3 nao encontrado. Sirva esta pasta com qualquer servidor HTTP local."
          PS1
          cat > portable/HOC2-PLAYTEST-01/LEIA-ME.txt <<'TXT'
          HOC2 PLAYTEST 01 — Tehkné Solutions

          1. Extraia o ZIP completo.
          2. Execute INICIAR-HOC2.cmd no Windows.
          3. O navegador abrira http://127.0.0.1:4173/hoc2.html
          4. Teste o fluxo Living Map -> Hexa -> Movimento -> Card Combat -> retorno ao mapa.

          Observacao: Brakk usa fallback tatico temporario; a arte definitiva esta registrada como divida de producao no Issue #319.
          TXT
          (cd portable && zip -qr ../HOC2-PLAYTEST-01-WEB.zip HOC2-PLAYTEST-01)
          test -f HOC2-PLAYTEST-01-WEB.zip
          unzip -l HOC2-PLAYTEST-01-WEB.zip | grep -q 'hoc2.html'
          echo "HOC2_PLAYTEST01_PORTABLE=PASS"

      - name: Upload portable HOC2 package
        uses: actions/upload-artifact@v4
        with:
          name: HOC2-PLAYTEST-01-WEB
          path: client/web/HOC2-PLAYTEST-01-WEB.zip
          if-no-files-found: error
          retention-days: 30
